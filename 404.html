<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <title id="page-title">Yönlendiriliyorsunuz...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript">
      // 1. Tüm uygulamalar için uzantısız yasal/destek linklerini (.html olmadan yazılanları) doğrudan ilgili web sayfasına yönlendir
      (function () {
        var p = (window.location.pathname || "").replace(/\/+$/, "");
        var q = window.location.search || "";
        var lower = p.toLowerCase();

        // /<app>/(faq|fqa|privacy-policy|terms-of-service|support) -> /<app>/<page>.html
        var staticMatch = lower.match(/^\/(wordlegend|magicmirror|volexi|reflex|pawia|soonify)\/(faq|fqa|privacy-policy|terms-of-service|support)$/);
        if (staticMatch) {
          var appFolder = staticMatch[1];
          var pageName = staticMatch[2] === "fqa" ? "faq" : staticMatch[2];
          window.location.replace("/" + appFolder + "/" + pageName + ".html" + q);
          return;
        }
      })();
    </script>
    <style>
      body { background-color: #FFFDF9; text-align: center; padding-top: 12vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #2D2724; margin: 0; }
      .container { max-width: 400px; margin: 0 auto; padding: 28px 20px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); background: #fff; border: 1px solid #F0E6D8; }
      .title { color: #D4AF37; font-size: 24px; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }
      .desc { font-size: 14px; color: #665C54; margin-bottom: 24px; line-height: 1.5; }
      .btn { display: block; width: 100%; box-sizing: border-box; padding: 16px; margin: 10px 0; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 15px; }
      .app-btn { background: linear-gradient(135deg, #D4AF37 0%, #B88E3C 100%); color: #fff; box-shadow: 0 4px 14px rgba(212,175,55,0.35); }
      .store-btn { background-color: #F7F3EC; color: #5C5248; font-size: 13px; font-weight: 500; }
      .hint { font-size: 12px; color: #A69789; margin-bottom: 8px; margin-top: 18px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="app-title" class="title">✨ littleGENIUS</div>
      <p id="app-desc" class="desc">Uygulamaya yönlendiriliyorsunuz...</p>

      <a id="open-app-btn" href="#" class="btn app-btn">Uygulamada Aç</a>

      <div class="hint">Uygulamanız henüz yüklü değilse:</div>
      <a id="store-btn" href="#" class="btn store-btn">Mağazadan İndir</a>
    </div>

    <script type="text/javascript">
      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      var host = window.location.host || "www.littlegenius.tr";
      var pathname = window.location.pathname || "/";
      var search = window.location.search || "";
      var path = pathname + search;

      var isWordLegend = /^\/(wordlegend|wl)(\/|$)/i.test(pathname);
      var isVolexi = /^\/volexi(\/|$)/i.test(pathname);
      var isReflex = /^\/reflex(\/|$)/i.test(pathname);
      var isPawia = /^\/pawia(\/|$)/i.test(pathname);
      var isSoonify = /^\/soonify(\/|$)/i.test(pathname);

      // Her uygulama için alt yolu temizle (örn. /wordlegend/duel -> /duel)
      var cleanSubPath = pathname.replace(/^\/(wordlegend|wl|magicmirror|volexi|reflex|pawia|soonify)/i, "");
      if (!cleanSubPath || cleanSubPath === "/") {
        cleanSubPath = "/play";
      }
      var schemeTarget = cleanSubPath.replace(/^\/+/, "") + search;

      var config;
      if (isWordLegend) {
        config = {
          pageTitle: "Word Legend | Kelime Oyunu",
          title: "🧩 WORD LEGEND",
          desc: "Word Legend oyununa yönlendiriliyorsunuz.",
          androidPackage: "com.geniusmetaverse.wordlegendtr",
          iosScheme: "wordlegend://" + schemeTarget,
          iosStore: "https://apps.apple.com/us/app/word-legend-word-puzzle-game/id6765661559",
          androidStore: "https://play.google.com/store/apps/details?id=com.geniusmetaverse.wordlegendtr",
          webFallback: "/wordlegend/"
        };
      } else if (isVolexi) {
        config = {
          pageTitle: "Volexi | Kelime Bulmaca Oyunu",
          title: "🔤 VOLEXI",
          desc: "Volexi uygulamasına yönlendiriliyorsunuz.",
          androidPackage: "com.geniusmetaverse.volexi",
          iosScheme: "volexi://" + schemeTarget,
          iosStore: "/volexi/",
          androidStore: "/volexi/",
          webFallback: "/volexi/"
        };
      } else if (isReflex) {
        config = {
          pageTitle: "RefleX | Refleks Oyunu",
          title: "⚡ REFLEX",
          desc: "RefleX uygulamasına yönlendiriliyorsunuz.",
          androidPackage: "com.geniusmetaverse.reflex",
          iosScheme: "reflex://" + schemeTarget,
          iosStore: "/reflex/",
          androidStore: "/reflex/",
          webFallback: "/reflex/"
        };
      } else if (isPawia) {
        config = {
          pageTitle: "Pawia | Smart Pet Care",
          title: "🐾 PAWIA",
          desc: "Pawia uygulamasına yönlendiriliyorsunuz.",
          androidPackage: "com.geniusmetaverse.pawia",
          iosScheme: "pawia://" + schemeTarget,
          iosStore: "/pawia/",
          androidStore: "/pawia/",
          webFallback: "/pawia/"
        };
      } else if (isSoonify) {
        config = {
          pageTitle: "Soonify · littleGENIUS",
          title: "⏳ SOONIFY",
          desc: "Soonify sayfasına yönlendiriliyorsunuz.",
          androidPackage: "com.geniusmetaverse.soonify",
          iosScheme: "soonify://" + schemeTarget,
          iosStore: "/soonify/",
          androidStore: "/soonify/",
          webFallback: "/soonify/"
        };
      } else {
        var mmTarget = pathname.replace(/^\/magicmirror/i, "").replace(/^\/+/, "") + search;
        if (!mmTarget) mmTarget = "home";
        config = {
          pageTitle: "Magic Mirror | Dijital Gelinlik Provası",
          title: "✨ MAGIC MIRROR",
          desc: "Gelinlik koleksiyonu ve sanal prova kabinine yönlendiriliyorsunuz.",
          androidPackage: "com.geniusmetaversemagicmirror",
          iosScheme: "magicmirror://" + mmTarget,
          iosStore: "https://apps.apple.com/us/app/id6760668920",
          androidStore: "https://play.google.com/store/apps/details?id=com.geniusmetaversemagicmirror",
          webFallback: "/magicmirror/"
        };
      }

      document.title = config.pageTitle;
      document.getElementById("app-title").innerText = config.title;
      document.getElementById("app-desc").innerText = config.desc;

      var openBtn = document.getElementById("open-app-btn");
      var storeBtn = document.getElementById("store-btn");

      if (isAndroid) {
        var intentUrl = "intent://" + host + path +
          "#Intent;scheme=https;package=" + config.androidPackage + ";" +
          "S.browser_fallback_url=" + encodeURIComponent(config.androidStore) + ";end";
        openBtn.href = intentUrl;
        storeBtn.href = config.androidStore;
        storeBtn.innerText = "Google Play'den İndir";
        setTimeout(function () { window.location.href = intentUrl; }, 250);
      } else if (isIOS) {
        openBtn.href = config.iosScheme;
        storeBtn.href = config.iosStore;
        storeBtn.innerText = "App Store'dan İndir";
        setTimeout(function () { window.location.href = config.iosScheme; }, 250);
      } else {
        openBtn.style.display = "none";
        storeBtn.href = config.webFallback || config.androidStore;
        storeBtn.innerText = "Sayfayı Görüntüle";
      }
    </script>
  </body>
</html>
